name: BDS regression test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression-test:
    name: Production behavior
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2.1.2
        with:
          release: latest

      - name: Run maintained regression suite
        uses: matlab-actions/run-command@v2.1.1
        with:
          command: addpath('tests'); run_bds_regression_suite
